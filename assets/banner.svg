<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080f"/>
      <stop offset="50%" stop-color="#0c0c18"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="glow-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B7FDD" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#7B7FDD" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#7B7FDD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="knot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8c9e8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8a8bb8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a5b88" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.3" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#7B7FDD" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7B7FDD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.7" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#9B7FDD" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#9B7FDD" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="400" fill="url(#bg)"/>

  <!-- Subtle ambient orbs -->
  <ellipse cx="420" cy="160" rx="300" ry="200" fill="url(#orb1)"/>
  <ellipse cx="980" cy="240" rx="250" ry="180" fill="url(#orb2)"/>

  <!-- Thin horizontal scan lines for texture -->
  <g opacity="0.015">
    <line x1="0" y1="80" x2="1400" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1400" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1400" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1400" y2="320" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Grid dots pattern -->
  <g opacity="0.04">
    <circle cx="100" cy="100" r="1" fill="#fff"/>
    <circle cx="200" cy="100" r="1" fill="#fff"/>
    <circle cx="300" cy="100" r="1" fill="#fff"/>
    <circle cx="100" cy="200" r="1" fill="#fff"/>
    <circle cx="200" cy="200" r="1" fill="#fff"/>
    <circle cx="300" cy="200" r="1" fill="#fff"/>
    <circle cx="100" cy="300" r="1" fill="#fff"/>
    <circle cx="200" cy="300" r="1" fill="#fff"/>
    <circle cx="300" cy="300" r="1" fill="#fff"/>
    <circle cx="1100" cy="100" r="1" fill="#fff"/>
    <circle cx="1200" cy="100" r="1" fill="#fff"/>
    <circle cx="1300" cy="100" r="1" fill="#fff"/>
    <circle cx="1100" cy="200" r="1" fill="#fff"/>
    <circle cx="1200" cy="200" r="1" fill="#fff"/>
    <circle cx="1300" cy="200" r="1" fill="#fff"/>
    <circle cx="1100" cy="300" r="1" fill="#fff"/>
    <circle cx="1200" cy="300" r="1" fill="#fff"/>
    <circle cx="1300" cy="300" r="1" fill="#fff"/>
  </g>

  <!-- ═══ KNOT SYMBOL (center-left) ═══ -->
  <!-- Trefoil knot — stylized with three interlocking loops -->
  <g transform="translate(340, 200) scale(0.85)" opacity="0.9">
    <!-- Outer glow -->
    <g filter="url(#blur-lg)" opacity="0.3">
      <circle cx="0" cy="0" r="80" fill="#7B7FDD"/>
    </g>

    <!-- Knot strokes — three interlocking loops forming a trefoil -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Loop 1 — top -->
      <path d="M-8,-20 C-8,-70 -50,-80 -55,-45 C-60,-10 -25,0 -8,10"
            stroke="url(#knot-grad)" stroke-width="10" opacity="0.85"/>
      <!-- Loop 2 — bottom-left -->
      <path d="M-8,10 C-30,20 -65,50 -40,75 C-15,100 15,70 8,40"
            stroke="url(#knot-grad)" stroke-width="10" opacity="0.7"/>
      <!-- Loop 3 — bottom-right -->
      <path d="M8,40 C15,15 60,10 60,-20 C60,-55 25,-60 -8,-20"
            stroke="url(#knot-grad)" stroke-width="10" opacity="0.85"/>

      <!-- Inner highlight strokes (thinner, brighter) -->
      <path d="M-8,-20 C-8,-70 -50,-80 -55,-45 C-60,-10 -25,0 -8,10"
            stroke="#d0d1f0" stroke-width="3" opacity="0.3"/>
      <path d="M-8,10 C-30,20 -65,50 -40,75 C-15,100 15,70 8,40"
            stroke="#d0d1f0" stroke-width="3" opacity="0.2"/>
      <path d="M8,40 C15,15 60,10 60,-20 C60,-55 25,-60 -8,-20"
            stroke="#d0d1f0" stroke-width="3" opacity="0.3"/>
    </g>
  </g>

  <!-- ═══ TYPOGRAPHY ═══ -->

  <!-- "not" — main brand name -->
  <text x="520" y="170" font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace"
        font-size="72" font-weight="300" fill="#e4e1ed" letter-spacing="8" opacity="0.95">
    not
  </text>

  <!-- Tagline -->
  <text x="524" y="210" font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace"
        font-size="13" fill="#908fa0" letter-spacing="4" opacity="0.7">
    BECAUSE THE DEFAULTS WERE NEVER GOOD ENOUGH
  </text>

  <!-- Violet accent line -->
  <rect x="520" y="228" width="60" height="2" rx="1" fill="#7B7FDD" opacity="0.6"/>

  <!-- Project list -->
  <g font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace" font-size="13" letter-spacing="1.5">
    <text x="524" y="268" fill="#7B7FDD" opacity="0.8">NETWORK</text>
    <text x="640" y="268" fill="#5a5970" opacity="0.5">·</text>
    <text x="660" y="268" fill="#7B7FDD" opacity="0.8">BROWSER</text>
    <text x="788" y="268" fill="#5a5970" opacity="0.5">·</text>
    <text x="808" y="268" fill="#7B7FDD" opacity="0.8">DIA</text>
    <text x="856" y="268" fill="#5a5970" opacity="0.5">·</text>
    <text x="876" y="268" fill="#7B7FDD" opacity="0.8">OS LAYER</text>
  </g>

  <!-- Tech tags -->
  <g font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#5a5970" letter-spacing="1" opacity="0.5">
    <text x="524" y="300">Python · Rust · C++ · TypeScript</text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="396" width="1400" height="4" fill="#7B7FDD" opacity="0.15"/>
  <rect x="0" y="397" width="400" height="3" fill="#7B7FDD" opacity="0.3"/>

  <!-- Corner decorations -->
  <g stroke="#7B7FDD" stroke-width="0.5" opacity="0.15" fill="none">
    <!-- Top-left corner bracket -->
    <polyline points="40,60 40,40 60,40"/>
    <!-- Top-right corner bracket -->
    <polyline points="1340,40 1360,40 1360,60"/>
    <!-- Bottom-left corner bracket -->
    <polyline points="40,340 40,360 60,360"/>
    <!-- Bottom-right corner bracket -->
    <polyline points="1340,360 1360,360 1360,340"/>
  </g>

  <!-- Floating code-style decorators -->
  <g font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#3a394d" opacity="0.35">
    <text x="60" y="385">notevil076</text>
    <text x="1220" y="55">v2026.05</text>
  </g>

</svg>
